name: Shared utility checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r phase_04_indic_aec_corpus/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m shared.validate data/examples/qa.jsonl
      - run: python -m shared.evaluate data/examples/qa.jsonl data/examples/predictions.jsonl --output /tmp/agxqa-demo.json
