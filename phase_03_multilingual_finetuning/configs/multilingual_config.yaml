experiment: phase_3b
seeds: [42, 123, 2026]
training_languages: [en, hi, mr, bn, ta]
selection_languages: [en, hi, mr, bn, ta]
training:
  learning_rate: 0.00003
  num_train_epochs: 5
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 2
  weight_decay: 0.01
  warmup_ratio: 0.1
  lr_scheduler_type: linear
  optim: adamw_torch
  max_grad_norm: 1.0
  eval_strategy: epoch
  save_strategy: epoch
  metric_for_best_model: macro_f1
  load_best_model_at_end: true
  greater_is_better: true
  save_total_limit: 2
  logging_steps: 20
  report_to: [tensorboard]
